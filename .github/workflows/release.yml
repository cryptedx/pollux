name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test core
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Pollux.Core.Tests -c Release
      - name: Test copilot
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Pollux.Copilot.Tests -c Release
      - name: Publish (Native AOT)
        run: dotnet publish src/Pollux.App -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o out/Pollux
      - name: Package
        shell: pwsh
        run: |
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 out/Pollux/
          Compress-Archive -Path out/Pollux/* -DestinationPath Pollux-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pollux-${{ matrix.rid }}
          path: Pollux-${{ matrix.rid }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Pollux-*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes
