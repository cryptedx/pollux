name: ci

on:
  push:
    branches: [main]
  pull_request:

# No token permissions by default; each job asks for what it needs (S-18).
permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

# Actions are pinned by commit SHA (a tag can be moved); the comment names the release the SHA belongs to.
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # NuGet restores run in locked mode here (CI=true, see Directory.Build.props): packages.lock.json must match.
      - name: Test core
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Pollux.Core.Tests -c Release

      - name: Test copilot
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Pollux.Copilot.Tests -c Release

      # The RID follows from Platform (win-x64 / win-arm64). No -r: it would change every project's restore and fail locked mode.
      - name: Publish (Native AOT)
        run: dotnet publish src/Pollux.App -c Release -p:Platform=${{ matrix.platform }} -o artifacts/${{ matrix.rid }}

      # The Native AOT build starts its bundled Copilot CLI over stdio and completes the handshake (ADR 0002/0005).
      # ARM64 cannot run on the x64 runner; it is verified the same way on an ARM64 machine.
      - name: Copilot self-test
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $p = Start-Process artifacts/win-x64/Pollux.exe -ArgumentList '--copilot-selftest', "$PWD/copilot-selftest.txt" -Wait -PassThru
          Get-Content copilot-selftest.txt
          exit $p.ExitCode

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pollux-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 7
